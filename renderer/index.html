<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyra</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Drag handle — invisible bar at top for moving the window -->
    <div id="drag-bar">
      <span id="app-title">Nyra</span>
      <div id="window-controls">
        <button id="btn-minimize" title="Minimize">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 512 512"
          >
            <path d="M0 0h512v512H0z" fill="none" />
            <path
              fill="currentColor"
              d="M464 352H48c-26.5 0-48 21.5-48 48v32c0 26.5 21.5 48 48 48h416c26.5 0 48-21.5 48-48v-32c0-26.5-21.5-48-48-48"
            />
          </svg>
        </button>
        <button id="btn-close" title="Close">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 1024 1024"
          >
            <path d="M0 0h1024v1024H0z" fill="none" />
            <path
              fill="currentColor"
              d="M195.2 195.2a64 64 0 0 1 90.5 0L512 421.5l226.3-226.3a64 64 0 0 1 90.5 90.5L602.5 512l226.3 226.3a64 64 0 0 1-90.5 90.5L512 602.5L285.7 828.8a64 64 0 0 1-90.5-90.5L421.5 512L195.2 285.7a64 64 0 0 1 0-90.5"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Three.js VRM character canvas -->
    <canvas id="vrm-canvas"></canvas>

    <!-- Status indicator shown during listen / think states -->
    <div id="status-indicator" class="hidden">
      <span id="status-text">...</span>
    </div>

    <!-- Chat history (scrollable) -->
    <div id="chat-history"></div>

    <!-- Input row: text field + mic button + send button -->
    <div id="input-row">
      <button id="btn-mic" title="Rekam suara">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 48 48"
        >
          <path d="M0 0h48v48H0z" fill="none" />
          <g
            fill="none"
            stroke="currentColor"
            stroke-linejoin="round"
            stroke-width="4"
          >
            <rect
              width="14"
              height="27"
              x="17"
              y="4"
              fill="currentColor"
              rx="7"
            />
            <path
              stroke-linecap="round"
              d="M9 23c0 8.284 6.716 15 15 15s15-6.716 15-15M24 38v6"
            />
          </g>
        </svg>
      </button>
      <input
        id="text-input"
        type="text"
        placeholder="Write a message..."
        autocomplete="off"
      />
      <button id="btn-send" title="Kirim">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 512 512"
        >
          <path d="M0 0h512v512H0z" fill="none" />
          <path
            fill="currentColor"
            d="m476.59 227.05l-.16-.07L49.35 49.84A23.56 23.56 0 0 0 27.14 52A24.65 24.65 0 0 0 16 72.59v113.29a24 24 0 0 0 19.52 23.57l232.93 43.07a4 4 0 0 1 0 7.86L35.53 303.45A24 24 0 0 0 16 327v113.31A23.57 23.57 0 0 0 26.59 460a23.94 23.94 0 0 0 13.22 4a24.55 24.55 0 0 0 9.52-1.93L476.4 285.94l.19-.09a32 32 0 0 0 0-58.8"
          />
        </svg>
      </button>
    </div>

    <!--
    Three.js + three-vrm loaded from node_modules via relative path.
    Electron can resolve node_modules relative to the renderer file.
  -->
    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.module.js",
          "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
